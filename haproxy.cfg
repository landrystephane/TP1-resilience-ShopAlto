global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 2s
    timeout client 5s
    timeout server 5s

frontend portail
    bind *:80
    default_backend serveurs_web

backend serveurs_web
    balance roundrobin
    option httpchk GET /health.html
    http-check expect status 200
    server web1 web1:80 check inter 1s fall 2 rise 2
    server web2 web2:80 check inter 1s fall 2 rise 2
